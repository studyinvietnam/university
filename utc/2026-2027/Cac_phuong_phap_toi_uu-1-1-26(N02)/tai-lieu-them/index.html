<title>Slideshow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .slideshow {
    position: relative;
    width: 100%;
    height: 100vh;
  }

  .slide {
    display: none;
    width: 100%;
    height: 100vh;
    align-items: center;
    justify-content: center;
  }

  .slide.active {
    display: flex;
  }

  .slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    font-size: 2rem;
    padding: 10px 18px;
    cursor: pointer;
    border-radius: 6px;
    z-index: 10;
  }

  .nav-btn:hover {
    background: rgba(0,0,0,0.8);
  }

  #prevBtn { left: 20px; }
  #nextBtn { right: 20px; }

  .counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 1rem;
    background: rgba(0,0,0,0.5);
    padding: 6px 14px;
    border-radius: 20px;
    z-index: 10;
  }
</style>
</head>

  <button class="nav-btn" id="prevBtn">&#10094;</button>
  <button class="nav-btn" id="nextBtn">&#10095;</button>
  <div class="counter"><span id="current">1</span> / <span id="total">30</span></div>

</div>

<script>
  const slides = document.querySelectorAll('.slide');
  let index = 0;

  document.getElementById('total').textContent = slides.length;

  function showSlide(i) {
    slides[index].classList.remove('active');
    index = (i + slides.length) % slides.length;
    slides[index].classList.add('active');
    document.getElementById('current').textContent = index + 1;
  }

  document.getElementById('nextBtn').addEventListener('click', () => showSlide(index + 1));
  document.getElementById('prevBtn').addEventListener('click', () => showSlide(index - 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') showSlide(index + 1);
    if (e.key === 'ArrowLeft') showSlide(index - 1);
  });
</script>
