<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Streaming</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.10/hls.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px 30px;
            color: white;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .player-wrapper {
            padding: 30px;
            background: #1a1a1a;
            position: relative;
        }

        video {
            width: 100%;
            height: 600px;
            background: #000;
            border-radius: 10px;
        }

        .controls {
            padding: 20px 30px;
            background: white;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .url-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .url-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .status {
            padding: 15px 30px;
            font-size: 14px;
            background: #f5f5f5;
            color: #666;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .methods {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        .methods h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }

        .method-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .method-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .method-btn:hover {
            background: #667eea;
            color: white;
        }

        .method-btn.active {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }

            video {
                height: 300px;
            }

            .controls {
                flex-direction: column;
            }

            .url-input {
                width: 100%;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Trình phát Streaming</h1>
            <p>Xem video trực tuyến với nhiều phương thức khác nhau</p>
        </div>

        <div class="player-wrapper">
            <video id="video" controls autoplay></video>
        </div>

        <div class="controls">
            <input 
                type="text" 
                class="url-input" 
                id="streamUrl" 
                placeholder="Nhập URL streaming..."
                value="https://aismile.dpdns.org/live/hunganh/789789/1781"
            >
            <button class="btn btn-primary" onclick="loadStream()">Phát</button>
            <button class="btn btn-secondary" onclick="stopStream()">Dừng</button>
        </div>

        <div class="methods">
            <h3>Chọn phương thức phát:</h3>
            <div class="method-btns">
                <button class="method-btn active" onclick="setMethod('hls')">HLS.js</button>
                <button class="method-btn" onclick="setMethod('native')">Native HTML5</button>
                <button class="method-btn" onclick="setMethod('m3u8')">M3U8</button>
                <button class="method-btn" onclick="setMethod('ts')">TS Stream</button>
            </div>
        </div>

        <div class="status" id="status">Sẵn sàng phát. Chọn phương thức và nhấn nút "Phát".</div>
    </div>

    <script>
        let hls;
        let video = document.getElementById('video');
        let currentMethod = 'hls';

        function setMethod(method) {
            currentMethod = method;
            document.querySelectorAll('.method-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateStatus('info', `Đã chọn phương thức: ${method.toUpperCase()}`);
        }

        function updateStatus(type, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        function stopStream() {
            if (hls) {
                hls.destroy();
                hls = null;
            }
            video.pause();
            video.src = '';
            updateStatus('info', 'Đã dừng phát.');
        }

        function loadStream() {
            const url = document.getElementById('streamUrl').value.trim();

            if (!url) {
                updateStatus('error', 'Vui lòng nhập URL streaming!');
                return;
            }

            stopStream();
            updateStatus('info', `Đang tải streaming bằng phương thức ${currentMethod.toUpperCase()}...`);

            try {
                switch(currentMethod) {
                    case 'hls':
                        loadWithHLS(url);
                        break;
                    case 'native':
                        loadNative(url);
                        break;
                    case 'm3u8':
                        loadM3U8(url);
                        break;
                    case 'ts':
                        loadTS(url);
                        break;
                }
            } catch (error) {
                updateStatus('error', `Lỗi: ${error.message}`);
                console.error('Error:', error);
            }
        }

        function loadWithHLS(url) {
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false;
                    }
                });

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().then(() => {
                        updateStatus('success', '✓ Đang phát streaming với HLS.js');
                    }).catch(err => {
                        updateStatus('error', `Lỗi phát: ${err.message}`);
                    });
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        updateStatus('error', `Lỗi HLS: ${data.type} - ${data.details}`);
                        console.error('HLS Error:', data);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().then(() => {
                    updateStatus('success', '✓ Đang phát streaming (Safari native)');
                }).catch(err => {
                    updateStatus('error', `Lỗi: ${err.message}`);
                });
            } else {
                updateStatus('error', 'Trình duyệt không hỗ trợ HLS. Thử phương thức khác.');
            }
        }

        function loadNative(url) {
            video.src = url;
            video.load();
            video.play().then(() => {
                updateStatus('success', '✓ Đang phát streaming (Native HTML5)');
            }).catch(err => {
                updateStatus('error', `Lỗi phát Native: ${err.message}`);
            });
        }

        function loadM3U8(url) {
            // Thử với extension .m3u8
            const m3u8Url = url.endsWith('.m3u8') ? url : url + '/index.m3u8';
            loadWithHLS(m3u8Url);
        }

        function loadTS(url) {
            // Thử phát trực tiếp file TS
            video.src = url;
            video.type = 'video/mp2t';
            video.load();
            video.play().then(() => {
                updateStatus('success', '✓ Đang phát TS stream');
            }).catch(err => {
                updateStatus('error', `Lỗi phát TS: ${err.message}. Thử URL: ${url}/playlist.m3u8`);
            });
        }

        // Event listeners
        video.addEventListener('loadstart', () => {
            updateStatus('info', 'Đang tải video...');
        });

        video.addEventListener('canplay', () => {
            updateStatus('success', '✓ Video đã sẵn sàng phát');
        });

        video.addEventListener('error', (e) => {
            let errorMsg = 'Lỗi không xác định';
            if (video.error) {
                switch(video.error.code) {
                    case 1: errorMsg = 'Tải video bị hủy'; break;
                    case 2: errorMsg = 'Lỗi mạng'; break;
                    case 3: errorMsg = 'Lỗi decode video'; break;
                    case 4: errorMsg = 'Định dạng không được hỗ trợ hoặc URL không hợp lệ'; break;
                }
            }
            updateStatus('error', `Lỗi video: ${errorMsg}. Thử phương thức khác hoặc kiểm tra URL.`);
        });

        document.getElementById('streamUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadStream();
            }
        });

        // Tự động thử phát khi load trang
        window.addEventListener('load', function() {
            setTimeout(() => {
                loadStream();
            }, 500);
        });
    </script>
</body>
</html>
