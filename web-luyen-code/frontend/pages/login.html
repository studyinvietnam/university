<!-- frontend/pages/login.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - CODE PRACTICE</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0e7ff 0%, #f0f2f5 100%);
        }
        .login-card {
            background: white;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 1.8rem;
            color: var(--text-primary);
        }
        .login-card .sub {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .otp-section {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: var(--border-radius);
            text-align: center;
        }
        .message.success {
            background: #dcfce7;
            color: #166534;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>🔑 CODE PRACTICE</h1>
            <p class="sub">Đăng nhập bằng email, không cần mật khẩu</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="user@gmail.com" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Gửi mã OTP</button>
            </form>
            <div id="otp-section" class="otp-section hidden">
                <form id="otp-form">
                    <div class="form-group">
                        <label for="otp">Mã OTP (6 số)</label>
                        <input type="text" id="otp" placeholder="123456" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-success" style="width:100%;">Xác nhận</button>
                </form>
                <div id="otp-message" class="message hidden"></div>
            </div>
            <div class="footer">Mã OTP sẽ được gửi qua email</div>
        </div>
    </div>
    <script type="module">
        import { authAPI } from '/assets/js/api-client.js';

        // Nếu đã đăng nhập, chuyển đến dashboard
        if (localStorage.getItem('token')) {
            window.location.href = '/pages/dashboard.html';
        }

        const loginForm = document.getElementById('login-form');
        const otpSection = document.getElementById('otp-section');
        const otpForm = document.getElementById('otp-form');
        const otpMessage = document.getElementById('otp-message');
        const emailInput = document.getElementById('email');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (!email) return;
            try {
                const data = await authAPI.sendOTP(email);
                otpSection.classList.remove('hidden');
                showMessage('OTP đã được gửi đến email của bạn', 'success');
            } catch (err) {
                showMessage(err.message || 'Lỗi gửi OTP', 'error');
            }
        });

        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value.trim();
            if (!otp) return;
            const email = emailInput.value.trim();
            try {
                const data = await authAPI.verifyOTP(email, otp);
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/pages/dashboard.html';
            } catch (err) {
                showMessage(err.message || 'OTP không hợp lệ', 'error');
            }
        });

        function showMessage(text, type) {
            otpMessage.textContent = text;
            otpMessage.className = `message ${type}`;
            otpMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
