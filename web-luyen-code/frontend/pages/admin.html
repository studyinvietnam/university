<!-- frontend/pages/admin.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CODE PRACTICE</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .admin-section {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        .admin-section h3 {
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .admin-section .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-draft { background: #fef3c7; color: #92400e; }
        .status-published { background: #dcfce7; color: #166534; }
        .status-archived { background: #fee2e2; color: #991b1b; }
        .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .info { flex: 1; }
        .list-item .actions { display: flex; gap: 8px; }
        .cancel-btn {
            margin-left: 12px;
            background: var(--color-secondary);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: var(--border-radius);
            cursor: pointer;
        }
        .cancel-btn:hover {
            background: #4b5563;
        }
        input[readonly] {
            background: var(--bg-secondary);
            cursor: not-allowed;
        }
        .grading-textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
        }
        .grading-textarea:focus {
            outline: 2px solid var(--color-primary);
            outline-offset: 1px;
        }
        small {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>⚙️ Quản trị</h1>
        <div class="user-info">
            <span id="user-name">Admin</span>
            <button class="btn btn-danger" id="logout-btn">Đăng xuất</button>
        </div>
    </header>

    <div class="container mt-2">
        <!-- Môn học -->
        <div class="admin-section">
            <h3>📚 Quản lý môn học</h3>
            <form id="subject-form">
                <input type="hidden" id="subject-id">
                <div class="form-row">
                    <div class="form-group">
                        <label>Tên môn</label>
                        <input type="text" id="subject-name" required>
                    </div>
                    <div class="form-group">
                        <label>Mã môn</label>
                        <input type="text" id="subject-code" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Mô tả</label>
                    <textarea id="subject-desc" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Trạng thái</label>
                    <select id="subject-status">
                        <option value="draft">📝 Draft</option>
                        <option value="published">✅ Published</option>
                        <option value="archived">📦 Archived</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" data-mode="create">Tạo môn</button>
                <button type="button" class="cancel-btn" id="cancel-subject-edit" style="display:none;">Hủy sửa</button>
            </form>
            <div id="subject-list" style="margin-top:16px;"></div>
        </div>

        <!-- Chương -->
        <div class="admin-section">
            <h3>📖 Quản lý chương</h3>
            <form id="chapter-form">
                <input type="hidden" id="chapter-id">
                <div class="form-group">
                    <label>Môn</label>
                    <select id="chapter-subject" required></select>
                </div>
                <div class="form-group">
                    <label>Tên chương</label>
                    <input type="text" id="chapter-name" required>
                </div>
                <div class="form-group">
                    <label>Thứ tự</label>
                    <input type="number" id="chapter-order" value="1" required>
                </div>
                <div class="form-group">
                    <label>Trạng thái</label>
                    <select id="chapter-status">
                        <option value="draft">📝 Draft</option>
                        <option value="published">✅ Published</option>
                        <option value="archived">📦 Archived</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" data-mode="create">Tạo chương</button>
                <button type="button" class="cancel-btn" id="cancel-chapter-edit" style="display:none;">Hủy sửa</button>
            </form>
            <div id="chapter-list" style="margin-top:16px;"></div>
        </div>

        <!-- Bài tập -->
        <div class="admin-section">
            <h3>📝 Quản lý bài tập</h3>
            <form id="problem-form">
                <input type="hidden" id="problem-id">
                <div class="form-row">
                    <div class="form-group">
                        <label>Môn</label>
                        <select id="problem-subject" required></select>
                    </div>
                    <div class="form-group">
                        <label>Chương</label>
                        <select id="problem-chapter" required></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Tên bài</label>
                    <input type="text" id="problem-name" required>
                </div>
                <div class="form-group">
                    <label>Mã bài</label>
                    <input type="text" id="problem-code" required>
                </div>
                <div class="form-group">
                    <label>Đề bài</label>
                    <textarea id="problem-statement" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>Input mẫu</label>
                    <input type="text" id="problem-input-sample">
                </div>
                <div class="form-group">
                    <label>Output mẫu</label>
                    <input type="text" id="problem-output-sample">
                </div>
                <div class="form-group">
                    <label>Điểm</label>
                    <input type="number" id="problem-score" value="10">
                </div>
                <div class="form-group">
                    <label>Ngôn ngữ</label>
                    <select id="problem-languages" multiple>
                        <option value="c">C</option>
                        <option value="cpp" selected>C++</option>
                        <option value="java">Java</option>
                        <option value="python">Python</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Trạng thái</label>
                    <select id="problem-status">
                        <option value="draft">📝 Draft</option>
                        <option value="published">✅ Published</option>
                        <option value="archived">📦 Archived</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Yêu cầu chấm (nếu có)</label>
                    <textarea id="problem-grading-requirements" class="grading-textarea" rows="3" placeholder="Ví dụ: Không dùng mảng&#10;Phải dùng vòng lặp for&#10;Không dùng đệ quy"></textarea>
                    <small>Nhập các yêu cầu đặc biệt cho bài tập, mỗi yêu cầu một dòng.</small>
                </div>
                <button type="submit" class="btn btn-primary" data-mode="create">Tạo bài</button>
                <button type="button" class="cancel-btn" id="cancel-problem-edit" style="display:none;">Hủy sửa</button>
            </form>
            <div id="problem-list" style="margin-top:16px;"></div>
        </div>
    </div>

    <script type="module">
        import { adminAPI, subjectAPI, chapterAPI } from '/assets/js/api-client.js';
        import {
            loadSubjectList,
            deleteSubject,
            editSubject,
            handleSubjectSubmit,
            cancelEditSubject,
            loadChapterList,
            deleteChapter,
            editChapter,
            handleChapterSubmit,
            cancelEditChapter,
            loadProblemList,
            deleteProblem,
            editProblem,
            handleProblemSubmit,
            cancelEditProblem,
            loadSubjectsForSelect,
            setupChapterDropdown
        } from '/assets/js/admin-helper.js';

        // ============================================================
        // AUTH CHECK
        // ============================================================
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/pages/login.html';
        }

        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user.role !== 'admin') {
            alert('Bạn không có quyền truy cập trang admin.');
            window.location.href = '/pages/dashboard.html';
        }

        document.getElementById('user-name').textContent = user.name || 'Admin';

        // ============================================================
        // SETUP FORMS
        // ============================================================
        document.getElementById('subject-form').addEventListener('submit', handleSubjectSubmit);
        document.getElementById('cancel-subject-edit').addEventListener('click', () => {
            cancelEditSubject();
            document.getElementById('cancel-subject-edit').style.display = 'none';
        });

        document.getElementById('chapter-form').addEventListener('submit', handleChapterSubmit);
        document.getElementById('cancel-chapter-edit').addEventListener('click', () => {
            cancelEditChapter();
            document.getElementById('cancel-chapter-edit').style.display = 'none';
        });

        document.getElementById('problem-form').addEventListener('submit', handleProblemSubmit);
        document.getElementById('cancel-problem-edit').addEventListener('click', () => {
            cancelEditProblem();
            document.getElementById('cancel-problem-edit').style.display = 'none';
        });

        // ============================================================
        // OVERRIDE EDIT TO SHOW CANCEL BUTTON
        // ============================================================
        const originalEditSubject = editSubject;
        window.editSubject = async (id) => {
            await originalEditSubject(id);
            document.getElementById('cancel-subject-edit').style.display = 'inline-block';
        };

        const originalEditChapter = editChapter;
        window.editChapter = async (id) => {
            await originalEditChapter(id);
            document.getElementById('cancel-chapter-edit').style.display = 'inline-block';
        };

        const originalEditProblem = editProblem;
        window.editProblem = async (id) => {
            await originalEditProblem(id);
            document.getElementById('cancel-problem-edit').style.display = 'inline-block';
        };

        // ============================================================
        // EXPOSE DELETE
        // ============================================================
        window.deleteSubject = deleteSubject;
        window.deleteChapter = deleteChapter;
        window.deleteProblem = deleteProblem;

        // ============================================================
        // INIT
        // ============================================================
        setupChapterDropdown();
        await loadSubjectsForSelect();
        await loadSubjectList();
        await loadChapterList();
        await loadProblemList();

        // ============================================================
        // LOGOUT
        // ============================================================
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '/pages/login.html';
        });
    </script>
</body>
</html>
