<!-- frontend/pages/dashboard.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CODE PRACTICE</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }
        .dashboard-card {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .dashboard-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .dashboard-card .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .dashboard-card h3 {
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .dashboard-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .user-name {
            font-weight: 600;
        }
        .error-message {
            color: var(--color-danger);
            padding: 20px;
            text-align: center;
            background: #fee2e2;
            border-radius: var(--border-radius);
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>💻 CODE PRACTICE</h1>
        <div class="user-info">
            <span class="user-name" id="user-name">Nguyễn Văn A</span>
            <button class="btn btn-danger" id="logout-btn">Đăng xuất</button>
        </div>
    </header>

    <div class="container mt-2">
        <h2>📚 Chọn môn học</h2>
        <div class="dashboard-grid" id="subject-grid">
            <div class="loading">⏳ Đang tải...</div>
        </div>
    </div>

    <script type="module">
        import { subjectAPI } from '/assets/js/api-client.js';

        // ============================================================
        // AUTH CHECK
        // ============================================================
        const token = localStorage.getItem('token');
        console.log('🔑 Token:', token ? 'Có token' : 'Không có token');

        if (!token) {
            console.log('🚫 Chưa đăng nhập, chuyển đến login');
            window.location.href = '/pages/login.html';
        }

        const user = JSON.parse(localStorage.getItem('user') || '{}');
        console.log('👤 User:', user);

        document.getElementById('user-name').textContent = user.name || 'User';

        // ============================================================
        // LOAD SUBJECTS WITH DEBUG
        // ============================================================
        async function loadSubjects() {
            const grid = document.getElementById('subject-grid');
            
            try {
                console.log('🔄 Đang gọi API /api/subjects...');
                const subjects = await subjectAPI.getAll();
                console.log('📦 Dữ liệu nhận được:', subjects);
                console.log('📦 Loại dữ liệu:', typeof subjects);
                console.log('📦 Số lượng:', Array.isArray(subjects) ? subjects.length : 'Không phải mảng');

                if (!subjects) {
                    console.warn('⚠️ subjects là null hoặc undefined');
                    grid.innerHTML = '<p style="color:var(--text-secondary);">Không nhận được dữ liệu từ server.</p>';
                    return;
                }

                if (!Array.isArray(subjects)) {
                    console.warn('⚠️ subjects không phải mảng:', subjects);
                    grid.innerHTML = '<p style="color:var(--text-secondary);">Dữ liệu không đúng định dạng.</p>';
                    return;
                }

                if (subjects.length === 0) {
                    console.log('ℹ️ subjects rỗng, chưa có môn học nào');
                    grid.innerHTML = '<p style="color:var(--text-secondary);">Chưa có môn học nào.</p>';
                    return;
                }

                console.log(`✅ Có ${subjects.length} môn học, đang render...`);
                
                grid.innerHTML = subjects.map((sub, index) => {
                    console.log(`  📚 Môn ${index + 1}:`, sub.name, '| ID:', sub._id, '| Status:', sub.status);
                    return `
                        <div class="dashboard-card" data-subject-id="${sub._id}">
                            <div class="icon">📘</div>
                            <h3>${sub.name}</h3>
                            <p>${sub.description || ''}</p>
                            <p style="margin-top:8px;font-size:0.8rem;color:var(--color-secondary);">
                                ${sub.problemCount || 0} bài tập
                            </p>
                            <button class="btn btn-primary mt-1" style="width:100%;">Học ngay</button>
                        </div>
                    `;
                }).join('');

                // Gắn sự kiện click
                document.querySelectorAll('.dashboard-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = card.dataset.subjectId;
                        console.log('🖱️ Click vào môn:', id);
                        window.location.href = `/pages/chapters.html?subjectId=${id}`;
                    });
                });

                console.log('✅ Render hoàn tất');

            } catch (err) {
                console.error('❌ LỖI tải môn học:', err);
                console.error('❌ Chi tiết lỗi:', err.message);
                console.error('❌ Stack trace:', err.stack);
                
                grid.innerHTML = `
                    <div class="error-message">
                        <strong>❌ Lỗi tải dữ liệu</strong><br>
                        ${err.message}
                        <br><br>
                        <small style="color:var(--text-secondary);">Vui lòng kiểm tra console (F12) để xem chi tiết.</small>
                    </div>
                `;
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        console.log('🚀 Dashboard khởi tạo');
        await loadSubjects();

        // ============================================================
        // LOGOUT
        // ============================================================
        document.getElementById('logout-btn').addEventListener('click', () => {
            console.log('🚪 Đăng xuất');
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/pages/login.html';
        });

        console.log('✅ Dashboard sẵn sàng');
    </script>
</body>
</html>
