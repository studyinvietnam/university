<!-- frontend/pages/chapters.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chương học - CODE PRACTICE</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .chapter-list {
            margin-top: 24px;
        }
        .chapter-item {
            background: white;
            padding: 16px 20px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chapter-item:hover {
            background: var(--bg-secondary);
        }
        .chapter-item h3 {
            font-size: 1.1rem;
        }
        .chapter-item .problem-count {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: var(--color-primary);
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>📖 Chương học</h1>
        <div class="user-info">
            <span id="user-name">User</span>
            <button class="btn btn-danger" id="logout-btn">Đăng xuất</button>
        </div>
    </header>

    <div class="container mt-2">
        <h2 id="subject-title">Môn học</h2>
        <div class="chapter-list" id="chapter-list">
            <!-- Load từ API -->
        </div>
        <a href="/pages/dashboard.html" class="back-link">← Quay lại danh sách môn</a>
    </div>

    <script type="module">
        import { subjectAPI } from '/assets/js/api-client.js';

        // Kiểm tra đăng nhập
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/pages/login.html';
        }

        const user = JSON.parse(localStorage.getItem('user') || '{}');
        document.getElementById('user-name').textContent = user.name || 'User';

        const params = new URLSearchParams(window.location.search);
        const subjectId = params.get('subjectId');

        if (!subjectId) {
            alert('Thiếu subjectId');
            window.location.href = '/pages/dashboard.html';
        }

        async function loadChapters() {
            try {
                const chapters = await subjectAPI.getChapters(subjectId);
                const container = document.getElementById('chapter-list');
                if (chapters.length === 0) {
                    container.innerHTML = '<p>Chưa có chương nào.</p>';
                    return;
                }
                container.innerHTML = chapters.map(ch => `
                    <div class="chapter-item" data-chapter-id="${ch._id}">
                        <div>
                            <h3>${ch.name}</h3>
                            <span class="problem-count">${ch.problemCount || 0} bài tập</span>
                        </div>
                        <span>→</span>
                    </div>
                `).join('');

                document.querySelectorAll('.chapter-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = item.dataset.chapterId;
                        window.location.href = `/pages/problems.html?chapterId=${id}`;
                    });
                });
            } catch (err) {
                console.error(err);
                document.getElementById('chapter-list').innerHTML = `
                    <p style="color:var(--color-danger);">Lỗi tải chương</p>
                `;
            }
        }

        loadChapters();

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '/pages/login.html';
        });
    </script>
</body>
</html>
